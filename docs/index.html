/* ======================= FLAG TEXTURES ======================= */
function rr(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function finishTex(cn, w, h) {
  const c = cn.getContext("2d");
  const g = c.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, "rgba(255,255,255,0.24)"); g.addColorStop(0.42, "rgba(255,255,255,0.015)"); g.addColorStop(1, "rgba(0,0,0,0.2)");
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  c.globalAlpha = 0.1;
  c.strokeStyle = "#fff"; c.lineWidth = 0.6;
  for (let y = 1; y < h; y += 3) { c.beginPath(); c.moveTo(0, y); c.lineTo(w, y); c.stroke(); }
  c.strokeStyle = "#000";
  for (let x = 1; x < w; x += 4) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, h); c.stroke(); }
  c.globalAlpha = 1;
  c.restore();
  rr(c, 1, 1, w - 2, h - 2, 7); c.lineWidth = 2; c.strokeStyle = "rgba(0,0,0,0.28)"; c.stroke();
  rr(c, 2.5, 2.5, w - 5, h - 5, 6); c.lineWidth = 1; c.strokeStyle = "rgba(255,255,255,0.42)"; c.stroke();
}
function makeTex(img) {
  const w = 160, h = Math.max(60, Math.round(160 * img.naturalHeight / img.naturalWidth));
  const cn = document.createElement("canvas"); cn.width = w; cn.height = h;
  const c = cn.getContext("2d"); c.save(); rr(c, 0, 0, w, h, 8); c.clip(); c.drawImage(img, 0, 0, w, h);
  finishTex(cn, w, h);
  return {cv: cn, ar: h / w};
}
function fallbackTex(ct) {
  const w = 160, h = 106, cn = document.createElement("canvas"); cn.width = w; cn.height = h;
  const c = cn.getContext("2d"); c.save(); rr(c, 0, 0, w, h, 8); c.clip();
  let hsh = 0; for (const ch of ct.c) hsh = hsh * 31 + ch.charCodeAt(0);
  c.fillStyle = `hsl(${hsh % 360},78%,42%)`; c.fillRect(0, 0, w, h);
  c.fillStyle = "rgba(255,255,255,0.16)"; c.fillRect(0, 0, w, h / 3);
  c.fillStyle = "#fff"; c.font = `900 44px ${FONT}`; c.textAlign = "center"; c.textBaseline = "middle"; c.fillText(ct.c.toUpperCase(), w / 2, h / 2 + 1);
  finishTex(cn, w, h);
  return {cv: cn, ar: h / w};
}
let loaded = 0;
COUNTRIES.forEach(ct => {

function dims(tex, mw, mh) { let w = mw, h = w * tex.ar; if (h > mh) { h = mh; w = h / tex.ar; } return [w, h]; }

/* ======================= AUDIO ======================= */
let AC = null, master = null, soundOn = true;
function initAudio() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = soundOn ? 0.8 : 0; master.connect(AC.destination);
    // low black-hole hum
    const hum = AC.createGain(); hum.gain.value = 0.025; hum.connect(master);
    [55, 82.5].forEach(f => { const o = AC.createOscillator(); o.type = "sine"; o.frequency.value = f; o.connect(hum); o.start(); });
  } catch (e) { AC = null; }
}
function tone(freq, dur, type = "sine", vol = 0.1, slideTo = null, delay = 0) {
  if (!AC || !soundOn) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
}
let lastBounce = 0, lastGrunt = 0;
function sBounce() { const n = performance.now(); if (n - lastBounce < 45) return; lastBounce = n; tone(520 + Math.random() * 520, 0.06, "sine", 0.045); }
function sExit() { tone(520, 0.16, "triangle", 0.1, 880); tone(1040, 0.12, "sine", 0.04, 520); }
function sLand() { tone(1500 + Math.random() * 300, 0.04, "square", 0.02); }
function sBeep(f) { tone(f, 0.18, "square", 0.08); }
function sFanfare() { [523, 659, 784, 1047].forEach((f, i) => { tone(f, 0.35, "triangle", 0.14, null, i * 0.13); tone(f / 2, 0.35, "sine", 0.08, null, i * 0.13); }); tone(1047, 0.9, "triangle", 0.12, null, 0.55); }

/* ---------- FUNNY EMOTION SOUNDS (anger / cry / smile) ---------- */
function blip(freq, at, dur, type, vol, glideTo, vibHz, vibDepth) {
  if (!AC || !soundOn) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, at);
  if (glideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, glideTo), at + dur);
  if (vibHz) {
    const lfo = AC.createOscillator(), lg = AC.createGain();
    lfo.type = "sine"; lfo.frequency.value = vibHz; lg.gain.value = freq * vibDepth;
    lfo.connect(lg); lg.connect(o.frequency); lfo.start(at); lfo.stop(at + dur + 0.1);
  }
  g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(vol, at + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g); g.connect(master); o.start(at); o.stop(at + dur + 0.05);
}
function sAngry() {                                   // cartoon growl + snarl
  if (!AC || !soundOn) return; const t = AC.currentTime;
  blip(190, t, 0.45, "sawtooth", 0.15, 78, 27, 0.14);
  blip(95, t, 0.5, "square", 0.06, 62, 17, 0.07);
  blip(330, t + 0.03, 0.16, "sawtooth", 0.09, 150, 32, 0.2);
}
function sCry() {                                     // "boo-hoo-hoo" sobbing
  if (!AC || !soundOn) return; const t = AC.currentTime;
  [[0, 640, 430], [0.3, 720, 470], [0.62, 660, 360]].forEach(([d, f0, f1]) => {
    blip(f0, t + d, 0.28, "triangle", 0.13, f1, 9, 0.1);
    blip(f0 * 2, t + d, 0.24, "sine", 0.035, f1 * 2, 12, 0.08);
  });
}
function sLaugh() {                                   // hihihihi giggle
  if (!AC || !soundOn) return; const t = AC.currentTime;
  [880, 1000, 1120, 1240, 1360, 1200].forEach((f, i) => blip(f, t + i * 0.085, 0.07, "triangle", 0.09, f * 1.08));

}

function pickEmotion() {

let voices = [];
function loadVoices() { if ("speechSynthesis" in window) voices = speechSynthesis.getVoices(); }
if ("speechSynthesis" in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice() {
  loadVoices();
  const en = voices.filter(v => /^en/i.test(v.lang));
  const male = [/\bmale\b/i, /guy/i, /andrew/i, /christopher/i, /eric/i, /brian/i, /roger/i, /steffan/i, /david/i, /mark/i, /george/i, /ryan/i, /james/i, /thomas/i, /daniel/i, /alex\b/i, /fred/i, /aaron/i, /arthur/i, /oliver/i];
  for (const re of male) { const v = en.find(v => re.test(v.name) && !/female/i.test(v.name)); if (v) return {v, male: true}; }
  return {v: en[0] || null, male: false};
}
const NativeTts = window.AndroidTts || null;
function nativeTtsReady() { try { return !!(NativeTts && NativeTts.isReady()); } catch (e) { return false; } }
const speechQueue = [];
let activeSpeech = null;
function processSpeechQueue() {
  if (activeSpeech || !speechQueue.length) return;
  if (nativeTtsReady()) {
    const item = speechQueue.shift();
    let ok = false;
    try { ok = NativeTts.speak(item.text); } catch (e) { ok = false; }
    if (!ok) { processSpeechQueue(); if (item.cb) item.cb(); return; }
    activeSpeech = { native: true };
    setTimeout(() => { activeSpeech = null; processSpeechQueue(); if (item.cb) item.cb(); },
      Math.min(20000, 900 + item.text.length * 62));
    return;
  }
  const item = speechQueue.shift();
  const p = pickVoice();
  const u = new SpeechSynthesisUtterance(item.text);
  let finished = false, timer;
  const finish = () => {
    if (finished) return;
    finished = true;
    clearTimeout(timer);
    activeSpeech = null;
    processSpeechQueue();
    if (item.cb) item.cb();
  };
  const watchdog = () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      if (paused) { watchdog(); return; }
      if ("speechSynthesis" in window) speechSynthesis.cancel();
      finish();
    }, Math.max(10000, item.text.length * 350));
  };
  if (p.v) { u.voice = p.v; u.lang = p.v.lang; } else u.lang = "en-US";
  u.pitch = p.male ? 0.88 : 0.78;
  u.rate = 1;
  u.volume = 1;
  u.onstart = watchdog;
  u.onend = finish;
  u.onerror = finish;
  activeSpeech = u;
  watchdog();
  speechSynthesis.resume();
  speechSynthesis.speak(u);
}
function speak(text, cb) {
  if (!soundOn || (!("speechSynthesis" in window) && !nativeTtsReady())) {
    setTimeout(() => { if (cb) cb(); }, 1600 + text.length * 50);
    return;
  }
  if (!cb && speechQueue.length > 2) return;   // never let reactions jam the queue
  speechQueue.push({text, cb});
  processSpeechQueue();
}
function announceFlag(name, emotion) {
  if (!soundOn || (!("speechSynthesis" in window) && !nativeTtsReady())) return;
  const list = (emotion && EMOTION_CALLS[emotion]) || ELIMINATION_CALLS;
  const phrase = list[Math.floor(Math.random() * list.length)](name);
  speak(phrase);
}
function say(text, cb) { speak(text, cb); }

  const hold = roundT % GAP_EVENT_PERIOD >= GAP_EVENT_PERIOD - GAP_EVENT_HOLD;

        if (jj > 60) { a.av += (Math.random() - 0.5) * 5; b.av += (Math.random() - 0.5) * 5; }
        if (jj > 260 && performance.now() - lastGrunt > 900 && Math.random() < 0.45) {
          lastGrunt = performance.now();
          const collisionEmotions = ["anger", "cry", "shock", "fire"];
          const emo = collisionEmotions[Math.floor(Math.random() * collisionEmotions.length)];
          emote(emo, (a.x + b.x) / 2, (a.y + b.y) / 2, {life: 0.8, size: 34});

          f.vx += -ny * (Math.random() - 0.5) * 80; f.vy += nx * (Math.random() - 0.5) * 80;

  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(CX, CY, RR, 0, 6.29); ctx.fill();
  ctx.save(); ctx.lineCap = "round";
  const drawRing = () => {
    ctx.beginPath();
    ctx.arc(CX, CY, RR, gapA + GAP_HALF, gapA - GAP_HALF + Math.PI * 2);
    ctx.stroke();
  };
  ctx.shadowColor = pal.glow; ctx.shadowBlur = 40;
  ctx.strokeStyle = pal.glow; ctx.globalAlpha = 0.75; ctx.lineWidth = TH + 14;
  drawRing();
  ctx.globalAlpha = 1; ctx.shadowBlur = 18; ctx.lineWidth = TH + 4; ctx.strokeStyle = pal.border;
  drawRing();
  ctx.shadowBlur = 0; ctx.lineWidth = TH + 2; ctx.strokeStyle = "#000";
  drawRing();
  ctx.lineWidth = TH - 2; ctx.strokeStyle = "#ffffff";
  drawRing();
  ctx.fillStyle = pal.accent;
  for (const s of [-1, 1]) {
    const ea = gapA + s * GAP_HALF, ex = CX + RR * Math.cos(ea), ey = CY + RR * Math.sin(ea);
    ctx.beginPath(); ctx.arc(ex, ey, TH / 2, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}
function drawGrid() {
  txt("FLAGS ELIMINATED", 30, 960, 18, "#fff", "left", 800, 2);
  txt("ROUND " + round, CX, 960, 15, pal.accent, "center", 800, 2);
  txt(`${elimCount} / ${roundFlagTotal - 1}`, 690, 960, 18, "#fff", "right", 800, 2);
  txt(`SCORE: ${score}`, 30, 984, 14, pal.accent, "left", 800, 1);
  txt(`COMBO: ${combo}x`, 690, 984, 14, "#fff", "right", 800, 1);
  for (const f of done) { const [x, y] = slotPos(f.slot), [w, h] = dims(f.ct.tex, GRID.fw, GRID.fh); drawFlag(f.ct.tex, x, y, w, h, 0, false, 0); }
}
function drawSearch() {
  if (!showSearch) return;
  ctx.fillStyle = "rgba(0,0,0,0.85)";
  ctx.fillRect(0, 0, W, H);
  panel(CX - 200, 150, 400, 500, 30);
  txt("ADD COUNTRY FLAG", CX, 190, 26, pal.accent, "center", 900, 2);
  // Input box
  rr(ctx, CX - 180, 220, 360, 50, 12);
  ctx.fillStyle = "#111";
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = pal.border;
  ctx.stroke();
  txt("Search country name, then tap a result", CX, 248, 14, "rgba(255,255,255,0.55)", "center", 600);
  // Results
  if (searchResults.length === 0 && searchInput.length >= 2) {
    txt("No countries found", CX, 350, 18, "rgba(255,255,255,0.5)", "center", 600);
  } else if (searchInput.length < 2) {
    txt("Type at least 2 characters", CX, 350, 18, "rgba(255,255,255,0.5)", "center", 600);
  }
  searchResults.forEach((ct, i) => {
    const y = 290 + i * 55;
    if (y > 580) return;
    panel(CX - 180, y, 360, 50, 10);
    const [fw, fh] = dims(ct.tex, 36, 24);
    drawFlag(ct.tex, CX - 160, y + 25, fw, fh, 0, false, 0);
    txt(ct.n, CX - 115, y + 26, 18, "#fff", "left", 700);
  });
  panel(CX - 80, 590, 160, 45, 20);
  txt("CLOSE", CX, 614, 18, "#fff", "center", 800);
}
function drawFx() {
  for (const p of particles) { ctx.globalAlpha = 1 - p.t / p.life; ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, 2.5, 0, 6.29); ctx.fill(); }
  ctx.globalAlpha = 1;
  for (const c of confetti) { ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot); ctx.fillStyle = c.c; ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h); ctx.restore(); }
  for (const r of reactions) {
    const u = r.t / r.life, pop = u < 0.18 ? 0.55 + 0.45 * (u / 0.18) : 1 + 0.04 * Math.sin(r.t * 14);
    ctx.save(); ctx.globalAlpha = u > 0.7 ? 1 - (u - 0.7) / 0.3 : 1;
    ctx.translate(r.x, r.y - 95 * u); ctx.scale(pop, pop);
    ctx.font = `${r.size}px ${EMOJI_FONT}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(r.emoji, 0, 0); ctx.restore();
  }
  ctx.globalAlpha = 1;
}
function outlined(s, x, y, size, fill, maxW) {
  ctx.save(); ctx.font = `900 ${size}px ${FONT}`;
  while (maxW && size > 12 && ctx.measureText(s).width > maxW) { size -= 2; ctx.font = `900 ${size}px ${FONT}`; }
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
  ctx.lineWidth = Math.max(4, size / 7); ctx.strokeStyle = "#000"; ctx.strokeText(s, x, y);
  ctx.fillStyle = fill; ctx.fillText(s, x, y); ctx.restore();
}
function drawWinner() {
  if (!winner) return;
  const u = Math.min(1, winT / 1.2), e = 1 - Math.pow(1 - u, 3);
  const x = winner.sx + (CX - winner.sx) * e, y = winner.sy + (CY - 10 - winner.sy) * e;
  const [bw, bh] = dims(winner.ct.tex, 190 * flagScale, 150 * flagScale), sc = 0.18 + 0.82 * e;
  // rays
  ctx.save(); ctx.translate(x, y); ctx.rotate(T * 0.6); ctx.globalAlpha = 0.28 * e;
  for (let i = 0; i < 14; i++) { ctx.rotate(Math.PI * 2 / 14); ctx.fillStyle = i % 2 ? pal.accent : "#fff";
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-22, -280); ctx.lineTo(22, -280); ctx.closePath(); ctx.fill(); }
  ctx.restore(); ctx.globalAlpha = 1;
  ctx.save(); ctx.shadowColor = pal.accent; ctx.shadowBlur = 40 * e;
  drawFlag(winner.ct.tex, x, y, bw * sc, bh * sc, Math.sin(T * 2) * 0.05 * e, true, winner.ph); ctx.restore();
  if (u > 0.4) {
    const a = Math.min(1, (u - 0.4) / 0.4), pop = 1 + 0.08 * Math.sin(T * 6);
    ctx.globalAlpha = a;
    ctx.save(); ctx.translate(CX, CY - 175); ctx.scale(pop, pop); outlined("🏆 WINNER 🏆", 0, 0, 58, pal.accent); ctx.restore();
    outlined(winner.ct.n.toUpperCase(), CX, CY + 130, 50, "#fff", 560);
    if (infiniteMode) {
      outlined(`∞ ROUND ${infiniteRound}`, CX, CY + 185, 28, pal.accent, 400);
    }
    ctx.globalAlpha = 1;
  }
  if (showLike && !infiniteMode) {
    likeT += 1 / 60;
    const a = Math.min(1, likeT * 3), b = 1 + 0.05 * Math.sin(T * 7);
    ctx.save(); ctx.globalAlpha = a; ctx.translate(CX, CY + 222); ctx.scale(b * (0.6 + 0.4 * a), b * (0.6 + 0.4 * a));
    rr(ctx, -300, -58, 600, 116, 26); ctx.fillStyle = "rgba(0,0,0,0.78)"; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = pal.accent; ctx.stroke();
    outlined("HIT LIKE & SUBSCRIBE", 0, -24, 34, "#fff", 560);
    outlined("LIKE · SUBSCRIBE · SHARE", 0, 8, 22, pal.accent, 560);
    rr(ctx, -228, 24, 150, 28, 14); ctx.fillStyle = "#1f6fff"; ctx.fill(); txt("👍 LIKE", -153, 39, 16, "#fff", "center", 900);
    rr(ctx, -50, 24, 180, 28, 14); ctx.fillStyle = "#ff1f1f"; ctx.fill(); txt("SUBSCRIBE", 40, 39, 16, "#fff", "center", 900, 1);
    rr(ctx, 150, 24, 70, 28, 14); ctx.fillStyle = "#ffffff"; ctx.fill(); txt("🔔", 185, 39, 16, "#000", "center", 900);
    ctx.restore();
  }
}
function drawOverlay() {
  if (phase === "start") {
    ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.fillRect(0, 0, W, H);
    outlined("BOOST", CX, 460, 82, pal.accent);
    outlined("FLAG", CX, 545, 82, "#fff");
    outlined("RUSH", CX, 625, 76, pal.accent);
    const p = 1 + 0.05 * Math.sin(T * 5);
    ctx.save(); ctx.translate(CX, 770); ctx.scale(p, p); panel(-170, -40, 340, 80, 40); txt("TAP TO START", 0, 1, 28, "#fff", "center", 900, 3); ctx.restore();
    txt(`${TOTAL} country flags · last flag standing wins`, CX, 835, 18, "rgba(255,255,255,0.95)", "center", 600, 0, 650);
    txt("Tap BOOST to turbo-charge the arena · double-tap for fullscreen", CX, 855, 15, pal.glow, "center", 700);
    txt("Escape through the moving gap to be eliminated!", CX, 880, 14, "rgba(255,255,255,0.9)", "center", 700);
    txt("Add flags with +FLAG (F key) · 6 difficulty levels (D key) · Infinite mode (I key)", CX, 905, 14, "#fff", "center", 700, 0, 680);
    txt("Funny reactions: tap emojis or press Z/X/C · tap a flag to tease it", CX, 930, 14, pal.accent, "center", 700, 0, 680);
    txt(`Loading flags ${Math.min(loaded, TOTAL)}/${TOTAL}`, CX, 955, 14, "rgba(255,255,255,0.8)", "center", 600);
  } else if (phase === "count") {
    const n = Math.ceil(cdT - 0.2), fr = cdT - Math.floor(cdT);
    const label = n >= 1 ? String(n) : "GO!";
    ctx.save(); ctx.translate(CX, CY); const s = 0.8 + fr * 0.6; ctx.scale(s, s);
    outlined(label, 0, 0, n >= 1 ? 160 : 120, pal.accent); ctx.restore();
    outlined("ROUND " + round, CX, CY - 150, 44, "#fff");
    txt(`${pal.name} THEME · ${difficulty.toUpperCase()} DIFFICULTY`, CX, CY + 130, 18, "#fff", "center", 800, 3);
    if (infiniteMode) {
      txt(`∞ INFINITE MODE · ROUND ${infiniteRound}`, CX, CY + 155, 14, pal.accent, "center", 800, 2);
    }
  }
  if (paused && phase !== "start") { ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.fillRect(0, 340, W, 620); outlined("PAUSED", CX, CY, 70, "#fff"); }
}

function drawWatermark() {
  const label = "COUNTRY_FLAGS_07";
  ctx.font = `800 15px ${FONT}`;
  const w = Math.round(ctx.measureText(label).width) + 26, h = 28, x = W - 30 - w, y = 216;
  ctx.save(); ctx.shadowColor = "rgba(0,0,0,0.45)"; ctx.shadowBlur = 10; ctx.shadowOffsetY = 3;
  rr(ctx, x, y, w, h, 14); ctx.fillStyle = "#fff"; ctx.fill();
  ctx.restore();
  txt(label, x + w / 2, y + h / 2 + 1, 15, "#000", "center", 800, 1);
}

function draw() {
  ctx.setTransform(S * DPR, 0, 0, S * DPR, 0, 0);
  drawBG(); drawTop(); drawArena();
  for (const f of alive) { if (f.state === "winner") continue; const [w, h] = dims(f.ct.tex, FW * flagScale, FH * flagScale); drawFlag(f.ct.tex, f.x, f.y, w, h, f.a, true, f.ph); }
  drawGrid();
  for (const f of anims) if (f.state === "drop") { const [w, h] = dims(f.ct.tex, FW * flagScale, FH * flagScale); drawFlag(f.ct.tex, f.x, f.y, w * f.sc, h * f.sc, f.a, false, 0); }
  if (phase === "winner") { ctx.fillStyle = "rgba(0,0,0,0.35)"; ctx.beginPath(); ctx.arc(CX, CY, RR - 6, 0, 6.29); ctx.fill(); drawWinner(); }
  drawFx(); drawOverlay(); drawWatermark();
  if (showSearch) drawSearch();
}

/* ======================= LOOP ======================= */
let last = performance.now();
function tick(dt) {
  T += dt;
  if (paused) return;
  const sim = dt * speed;
  if (phase === "play") {
    boostT = Math.max(0, boostT - dt);
    boostCooldown = Math.max(0, boostCooldown - dt);
  }
  if (phase === "play") {
    const n = Math.ceil(4 * speed), sdt = sim / n;
    for (let i = 0; i < n; i++) step(sdt);
    if (alive.length === 1) declareWinner();
  }
  if (phase === "count") {
    cdT -= dt; const n = Math.ceil(cdT - 0.2);
    if (n < lastCd) { lastCd = n; sBeep(n >= 1 ? 660 : 990); }
    if (cdT <= 0) phase = "play";
  }
  if (phase === "winner") winT += dt;
  updateAnims(sim); updateFx(sim);
}
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  tick(dt); draw(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ======================= INPUT ======================= */
function hit(b, x, y) { return x >= b[0] && x <= b[0] + b[2] && y >= b[1] && y <= b[1] + b[3]; }
const BOOST_DURATION = 2.6, BOOST_COOLDOWN = 11;
let boostT = 0, boostCooldown = 0;
function triggerBoost() {
  if (phase !== "play" || paused || boostCooldown > 0) return;
  boostT = BOOST_DURATION;
  boostCooldown = BOOST_COOLDOWN;
  const burst = 300;
  for (const f of alive) {
    const a = gapA + (Math.random() - 0.5) * GAP_HALF;
    f.vx += Math.cos(a) * burst;
    f.vy += Math.sin(a) * burst;
    const v = Math.hypot(f.vx, f.vy);
    if (v > MAXV) { f.vx *= MAXV / v; f.vy *= MAXV / v; }
  }
  tone(260, 0.32, "sawtooth", 0.13, 920);
  tone(520, 0.24, "triangle", 0.08, 1040, 0.05);
  for (let i = 0; i < 4; i++) emote("anger", CX + (Math.random() - 0.5) * RR * 1.4, CY + (Math.random() - 0.5) * RR * 1.4, {life: 0.9, size: 42});
  speak("BOOST ACTIVATED! The arena is going turbo!");
}
function pressEmotion(kind) {
  initAudio(); if (AC && AC.state === "suspended") AC.resume();
  emote(kind, CX, CY - 60, {life: 1.5, size: 76});
}
function flagAt(x, y) {
  const rr2 = Math.max(flagRadius() + 10, 26);
  let best = null, bd = rr2 * rr2;
  for (const f of alive) { const d = (f.x - x) ** 2 + (f.y - y) ** 2; if (d < bd) { bd = d; best = f; } }
  return best;
}
countrySearch.addEventListener("input", () => {
  searchInput = countrySearch.value.trimStart();
  searchResults = searchCountries(searchInput);
});
cv.addEventListener("dblclick", () => {
  const el = document.documentElement;
  if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(() => {});
  else if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
});
cv.addEventListener("pointerdown", e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
  initAudio(); if (AC && AC.state === "suspended") AC.resume();
  if (showSearch) {
    // Handle search close button
    if (x >= CX - 80 && x <= CX + 80 && y >= 590 && y <= 635) {
      closeSearch();
      return;
    }
    // Handle search result selection
    if (searchResults.length > 0) {
      for (let i = 0; i < searchResults.length; i++) {
        const ry = 290 + i * 55;
        if (ry > 580) break;
        if (x >= CX - 180 && x <= CX + 180 && y >= ry && y <= ry + 50) {
          addCountryToCenter(searchResults[i]);
          return;
        }
      }
    }
    return;
  }
  const onControl = Object.values(BTN).some(b => hit(b, x, y));
  if (phase === "start" && !onControl) {
    speak("Boost Flag Rush. Let's begin!"); startCountdown(); return;
  }
  if (hit(BTN.pause, x, y) && phase === "start") { speak("Boost Flag Rush. Let's begin!"); startCountdown(); return; }
  if (hit(BTN.angry, x, y)) { pressEmotion("anger"); return; }
  if (hit(BTN.cry, x, y)) { pressEmotion("cry"); return; }
  if (hit(BTN.smile, x, y)) { pressEmotion("smile"); return; }
  if (hit(BTN.boost, x, y)) { triggerBoost(); return; }
  if (hit(BTN.sizeDown, x, y)) { adjustFlagScale(-0.25); return; }
  if (hit(BTN.sizeUp, x, y)) { adjustFlagScale(0.25); return; }
  if (hit(BTN.addFlag, x, y)) { if (phase !== "winner") openSearch(); return; }
  if (hit(BTN.difficulty, x, y)) {
    const difficulties = ["Easy", "Medium", "Hard", "Insane", "Nightmare", "Chaos"];
    const idx = difficulties.indexOf(difficulty);
    difficulty = difficulties[(idx + 1) % difficulties.length];
    difficultyLevel = difficulties.indexOf(difficulty) + 1;
    applyDifficulty();
    speak(`Difficulty set to ${difficulty}!`);
    return;
  }
  if (hit(BTN.infinite, x, y)) {
    infiniteMode = !infiniteMode;
    infiniteRound = 0;
    speak(infiniteMode ? "Infinite mode activated! Endless rounds with increasing difficulty!" : "Infinite mode deactivated!");
    return;
  }
  if (hit(BTN.pause, x, y)) togglePause();
  else if (hit(BTN.sound, x, y)) toggleSound();
  else if (hit(BTN.speed, x, y)) speed = speed === 1 ? 2 : speed === 2 ? 3 : 1;
  else if (!paused && phase === "play") {
    const f = flagAt(x, y);
    if (f) {
      const kind = pickEmotion();
      emote(kind, f.x, f.y - 14, {life: 1, size: 40});
      f.av += (Math.random() - 0.5) * 14;
      f.vx += (Math.random() - 0.5) * 140; f.vy -= 90 + Math.random() * 90;
    }
  }
});
function togglePause() {
  paused = !paused;
  if (paused) { try { if (NativeTts) NativeTts.stop(); } catch (e) {} }
  if ("speechSynthesis" in window) paused ? speechSynthesis.pause() : speechSynthesis.resume();
}
function toggleSound() {
  soundOn = !soundOn;
  if (master) master.gain.value = soundOn ? 0.8 : 0;
  if (!soundOn) {
    try { if (NativeTts) NativeTts.stop(); } catch (e) {}
    if ("speechSynthesis" in window) { speechQueue.length = 0; speechSynthesis.cancel(); activeSpeech = null; }
  }
}
addEventListener("keydown", e => {
  if (showSearch) {
    if (e.key === "Escape") { closeSearch(); return; }
    if (e.target === countrySearch && e.key !== "Enter") return;
    if (e.key === "Backspace") { searchInput = searchInput.slice(0, -1); searchResults = searchCountries(searchInput); return; }
    if (e.key === "Enter" && searchResults.length > 0) { e.preventDefault(); addCountryToCenter(searchResults[0]); return; }
    if (e.target === countrySearch) return;
    if (e.key.length === 1) { searchInput += e.key; searchResults = searchCountries(searchInput); return; }
    return;
  }
  if (e.code === "Space") { e.preventDefault(); if (phase === "start") { initAudio(); if (AC && AC.state === "suspended") AC.resume(); speak("Boost Flag Rush. Let's begin!"); startCountdown(); } else togglePause(); }
  if (e.key === "+" || e.key === "=") adjustFlagScale(0.25);
  if (e.key === "-" || e.key === "_") adjustFlagScale(-0.25);
  if (e.key === "m" || e.key === "M") toggleSound();
  if (e.key === "b" || e.key === "B") triggerBoost();
  if (e.key === "z" || e.key === "Z") pressEmotion("anger");
  if (e.key === "x" || e.key === "X") pressEmotion("cry");
  if (e.key === "c" || e.key === "C") pressEmotion("smile");
  if (e.key === "1" || e.key === "2" || e.key === "3") speed = +e.key;
  if (e.key === "f" || e.key === "F") { if (phase !== "winner") openSearch(); }
  if (e.key === "d" || e.key === "D") {
    const difficulties = ["Easy", "Medium", "Hard", "Insane", "Nightmare", "Chaos"];
    const idx = difficulties.indexOf(difficulty);
    difficulty = difficulties[(idx + 1) % difficulties.length];
    difficultyLevel = difficulties.indexOf(difficulty) + 1;
    applyDifficulty();
    speak(`Difficulty set to ${difficulty}!`);
  }
  if (e.key === "i" || e.key === "I") {
    infiniteMode = !infiniteMode;
    infiniteRound = 0;
    speak(infiniteMode ? "Infinite mode activated! Endless rounds with increasing difficulty!" : "Infinite mode deactivated!");
  }
});

/* test hook: fast-forward simulation */
window.__ff = secs => { const n = Math.round(secs * 60); for (let i = 0; i < n && phase === "play"; i++) tick(1 / 60); return {alive: alive.length, elim: elimCount, t: roundT.toFixed(1), phase}; };
window.__state = () => ({phase, round, alive: alive.length, elim: elimCount, done: done.length, winners: winners.map(w => w.ct.n), flagScale, boostT, boostCooldown, loaded, total: TOTAL});
window.__emote = kind => pressEmotion(kind);
</script>
